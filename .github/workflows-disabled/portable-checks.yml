name: Portable regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audio-check:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['audio'] == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - run: python -m pip install --require-hashes --no-deps -r 'Test suite/python-checks-requirements.txt'
      - run: python -m pip install --no-deps --editable 'PC side'
      - name: Install declared Android toolchain
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $toolchain = Get-Content -LiteralPath 'StemWise/gradle/android-toolchain.properties' -Raw | ConvertFrom-StringData
          & (Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat') "platforms;android-$($toolchain.compileSdk)" "ndk;$($toolchain.ndkVersion)"
          if ($LASTEXITCODE -ne 0) { throw 'Android toolchain installation failed.' }
      - name: Run exact audio inventory and production compiler boundaries
        shell: pwsh
        run: "& 'Test suite/Run-Tester.ps1' -Mode AudioCheck"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audio-check
          retention-days: 2
          if-no-files-found: error
          path: |
            Test suite/work/audio-current/
            Test suite/work/native-host/*.exe
            Test suite/work/native-host/CMakeCache.txt
            Test suite/work/native-host/CTestTestfile.cmake
            Test suite/work/native-host/CMakeFiles/*/CMakeCXXCompiler.cmake
            StemWise/app/build/test-results/testDevelopmentUnitTest/TEST-*.xml
            StemWise/audio-engine/build/test-results/testDevelopmentUnitTest/TEST-*.xml
  audio-memory-core:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['audio'] == 'true'
    uses: ./.github/workflows/audio-sanitizer.yml
    with:
      kind: memory
      shard: core
      artifact: audio-memory-core
  audio-memory-long-30:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['audio'] == 'true'
    uses: ./.github/workflows/audio-sanitizer.yml
    with:
      kind: memory
      shard: long-30
      artifact: audio-memory-long-30
  audio-memory-long-37:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['audio'] == 'true'
    uses: ./.github/workflows/audio-sanitizer.yml
    with:
      kind: memory
      shard: long-37
      artifact: audio-memory-long-37
  audio-thread:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['audio'] == 'true'
    uses: ./.github/workflows/audio-sanitizer.yml
    with:
      kind: thread
      shard: all
      artifact: audio-thread
  audio-protocol:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['audio'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --no-deps -r 'Test suite/python-checks-requirements.txt'
      - run: python -m pip install --no-deps --editable 'PC side'
      - name: Install pinned ESBMC 8.5.0
        run: |
          mkdir -p 'Test suite/work/tools/esbmc-8.5'
          curl --fail --location 'https://github.com/esbmc/esbmc/releases/download/v8.5/esbmc-linux.zip' --output 'Test suite/work/tools/esbmc.zip'
          echo 'd8da304dd0dfce6c9f488379f03a72e768bce8598c22478c980e1704247352f1  Test suite/work/tools/esbmc.zip' | sha256sum --check -
          unzip -q 'Test suite/work/tools/esbmc.zip' -d 'Test suite/work/tools/esbmc-8.5'
          rm 'Test suite/work/tools/esbmc.zip'
      - run: python -B 'Test suite/native/formal/verify.py' --report 'Test suite/work/audio-current/protocol.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audio-protocol
          retention-days: 2
          if-no-files-found: error
          path: Test suite/work/audio-current/protocol.json
  audio-negative-controls:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['audio'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --no-deps -r 'Test suite/python-checks-requirements.txt'
      - run: python -m pip install --no-deps --editable 'PC side'
      - run: python -B 'Test suite/native/run_negative_controls.py' --report 'Test suite/work/audio-current/negative-controls.json'
      - run: python -B 'Test suite/native/run_negative_controls.py' --memory --case premature-resource-release --report 'Test suite/work/audio-current/negative-controls-memory.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audio-negative-controls
          retention-days: 2
          if-no-files-found: error
          path: Test suite/work/audio-current/negative-controls*.json
  audio-aggregate:
    needs: [changes, audio-check, audio-memory-core, audio-memory-long-30, audio-memory-long-37, audio-thread, audio-protocol, audio-negative-controls]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs['audio'] == 'true')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install and verify the declared sanitizer symbol reader
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $toolchain = Get-Content -LiteralPath 'StemWise/gradle/android-toolchain.properties' -Raw | ConvertFrom-StringData
          & (Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat') "ndk;$($toolchain.ndkVersion)"
          if ($LASTEXITCODE -ne 0) { throw 'Sanitizer symbol reader installation failed.' }
          python -B -c "import runpy; print(runpy.run_path('Test suite/native/run_sanitizers.py')['symbol_tool']())"
          if ($LASTEXITCODE -ne 0) { throw 'Sanitizer symbol reader is unavailable.' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: audio-check
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: audio-memory-*
          merge-multiple: true
          path: Test suite/work
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: audio-thread
          path: Test suite/work
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: audio-protocol
          path: Test suite/work/audio-current
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: audio-negative-controls
          path: Test suite/work/audio-current
      - name: Reconcile actual required executions even after upstream failure or skip
        shell: pwsh
        env:
          AUDIO_JOBS: >-
            {"audio-check":"${{ needs.audio-check.result }}","audio-memory-core":"${{ needs.audio-memory-core.result }}","audio-memory-long-30":"${{ needs.audio-memory-long-30.result }}","audio-memory-long-37":"${{ needs.audio-memory-long-37.result }}","audio-thread":"${{ needs.audio-thread.result }}","audio-protocol":"${{ needs.audio-protocol.result }}","audio-negative-controls":"${{ needs.audio-negative-controls.result }}"}
        run: >-
          python -B 'Test suite/host/audio_evidence.py' ci
          --plan 'Test suite/work/audio-current/plan.json' --jobs $env:AUDIO_JOBS
          --host 'Test suite/work/audio-current/host-receipt.json'
          --sanitizer-memory 'Test suite/work/audio-current/audio-memory-core.json' 'Test suite/work/audio-current/audio-memory-long-30.json' 'Test suite/work/audio-current/audio-memory-long-37.json'
          --sanitizer-thread 'Test suite/work/audio-current/audio-thread.json'
          --protocol 'Test suite/work/audio-current/protocol.json'
          --negative-controls 'Test suite/work/audio-current/negative-controls.json'
          --negative-controls-memory 'Test suite/work/audio-current/negative-controls-memory.json'
          --negative-controls-managed 'Test suite/work/audio-current/negative-controls-managed.json'
          --output 'Test suite/work/audio-current/ci-aggregate.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audio-aggregate
          retention-days: 2
          if-no-files-found: error
          path: Test suite/work/audio-current/ci-aggregate.json
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pc-contracts: ${{ steps.select.outputs['pc-contracts'] }}
      native: ${{ steps.select.outputs['native'] }}
      android: ${{ steps.select.outputs['android'] }}
      bridge-core: ${{ steps.select.outputs['bridge-core'] }}
      windows-ownership: ${{ steps.select.outputs['windows-ownership'] }}
      audio: ${{ steps.select.outputs['audio'] }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B 'Test suite/host/ci_changes.py'
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --no-deps -r 'Test suite/python-checks-requirements.txt'
      - run: python -m pip install --no-deps --editable 'PC side'
      - run: python -B 'Test suite/host/portable_checks.py'
      - run: python -B -m unittest discover -s 'Test suite/android/tools' -p 'test_*.py'
  pc-contracts:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['pc-contracts'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - run: python -m pip install --require-hashes --no-deps -r 'Test suite/python-checks-requirements.txt'
      - run: python -m pip install --no-deps --editable 'PC side'
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: python -m pip install torch==2.7.0+cpu torchaudio==2.7.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1 librosa==0.11.0 transformers==5.16.1 jsonschema==4.26.0 Pillow==12.3.0 yt-dlp==2026.8.19
      - run: python -B 'Test suite/pc/cpu_workflow_checks.py'
  native:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['native'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --no-deps -r 'Test suite/python-checks-requirements.txt'
      - run: python -m pip install --no-deps --editable 'PC side'
      - run: cmake -S StemWise/audio-engine/src/main/cpp -B 'Test suite/work/ci-native' -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: >-
          cmake --build 'Test suite/work/ci-native' --parallel 2
      - run: >-
          ctest --test-dir 'Test suite/work/ci-native' --output-on-failure --no-tests=error
      - run: python3 -B -m unittest discover -s 'Test suite/pc/unit' -p test_owned_linux_process.py
  android:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['android'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --no-deps -r 'Test suite/python-checks-requirements.txt'
      - run: python -m pip install --no-deps --editable 'PC side'
      - run: python -m pip install Pillow==12.3.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          python - <<'PY'
          import configparser, os, pathlib, subprocess
          properties = configparser.ConfigParser()
          properties.read_string('[android]\n'+pathlib.Path('StemWise/gradle/android-toolchain.properties').read_text())
          values = properties['android']
          subprocess.run([os.environ['ANDROID_SDK_ROOT']+'/cmdline-tools/latest/bin/sdkmanager',
                          'platforms;android-'+values['compileSdk'], 'ndk;'+values['ndkVersion']], check=True)
          PY
      - working-directory: StemWise
        run: bash gradlew :app:compileDevelopmentKotlin :app:compileDevelopmentAndroidTestKotlin :app:testDevelopmentUnitTest :app:lintDevelopment :app:externalNativeBuildDevelopment :audio-engine:externalNativeBuildDevelopment --no-daemon --max-workers=2
      - name: Check production shrinking, resources and JNI without signing credentials
        working-directory: StemWise
        run: bash gradlew :app:minifyReleaseWithR8 :app:optimizeReleaseResources :app:externalNativeBuildRelease :audio-engine:externalNativeBuildRelease --no-daemon --max-workers=2
  bridge-core:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['bridge-core'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --no-deps -r 'Test suite/python-checks-requirements.txt'
      - run: python -m pip install --no-deps --editable 'PC side'
      - name: Check SDK Android dependency inventory with pinned Go
        run: python -B StemWise/tools/verify-bridge-sdk.py --discover
      - name: Test and vet the consumed bridge source
        shell: pwsh
        run: >-
          & 'StemWise/third_party/phone-pc-bridge/source/test-suite/Run-Go.ps1'
          -Go (Get-Command go).Source
      - name: Check focused Go discovery and full-suite rejection
        shell: pwsh
        run: >-
          pwsh -NoProfile -File 'StemWise/third_party/phone-pc-bridge/source/test-suite/GoDiscoveryCheck.ps1'
          -Go (Get-Command go).Source
      - name: Require all seven Linux capacity regressions on private bounded filesystems
        run: python -B 'Test suite/pc/bridge_capacity_check.py'
      - name: Race-check the consumed bridge source
        shell: pwsh
        run: |
          $suite = 'StemWise/third_party/phone-pc-bridge/source/test-suite'
          $go = (Get-Command go).Source
          & "$suite/Run-Go.ps1" -Go $go -Race -Packages @('./protocol','./codex','./mobile','./pc','./cmd/bridge-pc-check','./files')
          if ($LASTEXITCODE -ne 0) { throw 'Bridge race regressions failed.' }
          $required = @(Get-Content -LiteralPath "$suite/backend-race-cases.json" -Raw | ConvertFrom-Json)
          $filter = '^(' + (($required | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')$'
          $events = @(& "$suite/Run-Go.ps1" -Go $go -Packages './backend' -Race -Json -Run $filter)
          if ($LASTEXITCODE -ne 0) { $events; throw 'Backend concurrency race regressions failed.' }
          $passed = @{}
          foreach ($line in $events) {
            $event = $line | ConvertFrom-Json -ErrorAction Stop
            if ($event.Action -eq 'skip' -and $event.Test -and
                $required -ccontains ($event.Test.Split('/')[0])) {
              $events; throw "Required backend concurrency regression skipped: $($event.Test)"
            }
            if ($event.Action -eq 'pass' -and $event.Package -ceq 'phonepcbridge/backend' -and $event.Test) {
              $passed[$event.Test] = 1 + $passed[$event.Test]
            }
          }
          foreach ($test in $required) {
            if ($passed[$test] -ne 1) { $events; throw "Required backend concurrency regression absent, duplicated or skipped: $test" }
          }
          Write-Output 'Every required backend concurrency regression executed and passed with the race detector.'
  windows-ownership:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs['windows-ownership'] == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --no-deps -r 'Test suite/python-checks-requirements.txt'
      - run: python -m pip install --no-deps --editable 'PC side'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - name: Exercise Windows process ownership and launcher recovery
        shell: pwsh
        run: >-
          python -B 'Test suite/pc/run_tests.py' --directory 'Test suite/pc'
          unit.test_owned_qualification_process
          unit.test_agent_launcher.DetachedAgentLauncherTests.test_forced_supervisor_death_retires_runner_and_detached_grandchild
          unit.test_agent_launcher.DetachedAgentLauncherTests.test_detached_worker_returns_immediately_and_records_exit
          unit.test_agent_launcher.DetachedAgentLauncherTests.test_create_failure_throws_and_removes_unowned_logs
          unit.test_agent_launcher.DetachedAgentLauncherTests.test_shared_parent_job_is_rejected_before_runner_starts
      - name: Exercise consumed Windows Bridge process and publication boundaries
        shell: pwsh
        run: |
          $events = @(& 'StemWise/third_party/phone-pc-bridge/source/test-suite/Run-Go.ps1' -Go (Get-Command go).Source -Packages @('./codex','./files') -Json)
          if ($LASTEXITCODE -ne 0) { $events; throw 'Windows Bridge regressions failed.' }
          $passed = @{}
          foreach ($line in $events) {
            $event = $line | ConvertFrom-Json -ErrorAction Stop
            if ($event.Action -eq 'pass' -and $event.Test) { $passed["$($event.Package)/$($event.Test)"] = $true }
          }
          $required = @{
            'phonepcbridge/codex' = @('TestOwnedCLIStopsActualDescendants', 'TestRetireTurnRequiresExactTerminalAndObservedEmptyBackgroundWork', 'TestClosedStdoutOrStartupCancellationReapsOwnedChildWithinBound')
            'phonepcbridge/files' = @('TestPublishRecoversAfterRealWindowsDirectorySharingDenial', 'TestPublishWindowsPermanentDenialIsBoundedAndPreservesCause', 'TestPublishWindowsCancellationRetiresPendingRetry', 'TestPublishWindowsDoesNotRetryOtherErrorsOrStartCancelledWork')
          }
          foreach ($package in $required.Keys) {
            foreach ($test in $required[$package]) {
              if (-not $passed["$package/$test"]) { $events; throw "Required Windows regression absent or skipped: $package/$test" }
            }
          }
          Write-Output 'Required Windows Bridge regressions executed and passed. Live Codex inference is excluded.'
